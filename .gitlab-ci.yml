stages:
  - build

build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  timeout: 2h
  script:
    - choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
    - $env:Path += ";C:\Program Files\CMake\bin"
    - cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
    - cmake --build build --config Release --parallel 4 --target SFC8_VST3 SFC8_Standalone
    - New-Item -ItemType Directory -Force out | Out-Null
    - Copy-Item -Recurse "build/SFC8_artefacts/Release/VST3/SFC-8.vst3" out/
    - Copy-Item "build/SFC8_artefacts/Release/Standalone/SFC-8.exe" out/
    - Copy-Item README.md out/
  artifacts:
    name: "SFC-8-Windows"
    paths:
      - out/
    expire_in: 90 days
